<!DOCTYPE html>
<html>
<head>
<title>Closed Complaints - Cyber Crime Complaint Management System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI', Arial, sans-serif;
background-image:url("images/bg.png");
background-size:cover;
background-position:center;
min-height:100vh;
}

/* NAVBAR */

.navbar{
background-image:url("images/header-bg.png");
background-size:cover;
background-position:center;
padding:18px 60px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
}

.navbar h2{
font-size:22px;
}

.navbar button{
background:white;
color:#1E3A8A;
border:none;
padding:7px 16px;
border-radius:6px;
cursor:pointer;
font-weight:600;
margin-left:8px;
}

/* CONTAINER */

.container{
width:95%;
margin:40px auto;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
background: rgba(255,255,255,0.9);
border-radius:18px;
overflow:hidden;
box-shadow:0 20px 45px rgba(0,0,0,0.2);
}

th{
background:#1E3A8A;
color:white;
padding:14px 10px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

tbody tr:hover{
background:#f3f4f6;
}

.status-closed{
color:#15803d;
font-weight:600;
}

/* MODAL */

#descModal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
}

.modal-box{
background:white;
padding:25px;
border-radius:10px;
width:400px;
max-width:90%;
text-align:center;
}

.modal-box h3{
color:#1E3A8A;
margin-bottom:10px;
}

.modal-box button{
background:#1E3A8A;
color:white;
padding:6px 14px;
border-radius:5px;
border:none;
cursor:pointer;
}

</style>
</head>

<body>

<div class="navbar">
<h2>Closed Complaints</h2>

<div>
<button onclick="goBack()">Back</button>
<button onclick="logout()">Logout</button>
</div>
</div>

<div class="container">

<table>

<thead>

<tr>
<th>ID</th>
<th>User</th>
<th>Category</th>
<th>Description</th>
<th>Officer</th>
<th>Phone</th>
<th>Priority</th>
<th>Date</th>
<th>Evidence</th>
</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>


<!-- DESCRIPTION MODAL -->

<div id="descModal">

<div class="modal-box">

<h3>Complaint Description</h3>

<p id="descText" style="margin-bottom:20px;"></p>

<button onclick="closeDesc()">Close</button>

</div>

</div>


<script>

const tableBody=document.getElementById("tableBody");

document.addEventListener("DOMContentLoaded",async function(){

const user=JSON.parse(localStorage.getItem("user"));

if(!user || user.role!=='admin'){
alert("Access denied");
window.location.href="login.html";
return;
}

loadClosedComplaints();

});


async function loadClosedComplaints(){

const res=await fetch("/complaints/closed");
const data=await res.json();

tableBody.innerHTML="";

if(data.length===0){
tableBody.innerHTML="<tr><td colspan='9'>No closed complaints</td></tr>";
return;
}

data.forEach(c=>{

let evidenceLink=c.file_path
? `<a href="/uploads/${c.file_path}" target="_blank">View</a>`
: "—";

tableBody.innerHTML+=`

<tr>

<td>${c.complaint_id}</td>

<td>${c.full_name}</td>

<td>${c.category_name}</td>

<td>
<a href="#" onclick="viewDescription(\`${c.description || "No description"}\`)">
View
</a>
</td>

<td>${c.officer_name || "-"}</td>

<td>${c.officer_phone || "-"}</td>

<td>${c.priority || "-"}</td>

<td>${new Date(c.complaint_date).toLocaleString()}</td>

<td>${evidenceLink}</td>

</tr>

`;

});

}


/* DESCRIPTION MODAL */

function viewDescription(text){

document.getElementById("descText").innerText=text;
document.getElementById("descModal").style.display="flex";

}

function closeDesc(){

document.getElementById("descModal").style.display="none";

}


/* NAVIGATION */

function goBack(){
window.location.href="complaints.html";
}

function logout(){
localStorage.removeItem("user");
window.location.href="index.html";
}

</script>

</body>
</html>
